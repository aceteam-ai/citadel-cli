# Orthanc Team 26.9.1 multi-architecture index (amd64 + arm64), not a floating tag.
# Only DICOM is LAN-facing. No workspace mount, bridge, cloud key, or viewer route.
services:
  orthanc:
    image: docker.io/orthancteam/orthanc@sha256:d2705f2c56547e55ce9bc2250fd22d05d326493b3f3d9fa191ecb7db8ca6b5a2
    container_name: citadel-radiology
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${CITADEL_RADIOLOGY_HOST_PORT:-8216}:8042"
      - "${RADIOLOGY_DICOM_PORT:-4242}:4242"
    volumes:
      - "${HOME:?node home required}/.citadel-cli/radiology/orthanc:/var/lib/orthanc"
    environment:
      ORTHANC__NAME: "Citadel Radiology - NOT FOR DIAGNOSTIC USE"
      ORTHANC__DICOM_AET: "${RADIOLOGY_AET:-CITADEL}"
      ORTHANC__DICOM_CHECK_CALLED_AET: "true"
      ORTHANC__DICOM_CHECK_MODALITY_HOST: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_STORE: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_ECHO: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_FIND: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_FIND_WORKLIST: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_GET: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_MOVE: "false"
      ORTHANC__DICOM_MODALITIES_IN_DATABASE: "false"
      # Fixed object paths, never interpolate peer strings into a JSON object.
      # Upstream's env mapper turns A_E_T into the case-sensitive key AET.
      ORTHANC__DICOM_MODALITIES__PACS__A_E_T: "${PACS_AET:?allowed peer AE required}"
      ORTHANC__DICOM_MODALITIES__PACS__HOST: "${PACS_HOST:?allowed peer host required}"
      ORTHANC__DICOM_MODALITIES__PACS__PORT: "${PACS_PORT:-4242}"
      ORTHANC__DICOM_MODALITIES__PACS__ALLOW_ECHO: "true"
      ORTHANC__DICOM_MODALITIES__PACS__ALLOW_STORE: "true"
      ORTHANC__DICOM_MODALITIES__PACS__ALLOW_FIND: "false"
      ORTHANC__DICOM_MODALITIES__PACS__ALLOW_FIND_WORKLIST: "false"
      ORTHANC__DICOM_MODALITIES__PACS__ALLOW_GET: "false"
      ORTHANC__DICOM_MODALITIES__PACS__ALLOW_MOVE: "false"
      ORTHANC__DICOM_MODALITIES__PACS__ALLOW_STORAGE_COMMITMENT: "false"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC_PASSWORD: "${RADIOLOGY_HTTP_PASSWORD:?generated HTTP secret required}"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__STORAGE_DIRECTORY: /var/lib/orthanc/storage
      ORTHANC__INDEX_DIRECTORY: /var/lib/orthanc/index
      ORTHANC__STABLE_AGE: "${RADIOLOGY_STABLE_AGE:-60}"
      DICOM_WEB_PLUGIN_ENABLED: "true"
      OHIF_PLUGIN_ENABLED: "false"
      ORTHANC_EXPLORER_2_ENABLED: "false"
      VERBOSE_STARTUP: "false"
      VERBOSE_ENABLED: "false"
      TRACE_ENABLED: "false"
    healthcheck:
      # Python3 is present in both pinned platform images. No shell-expanded
      # credential argv, HTTP body output, proxy, redirect, or traceback.
      test:
        - CMD
        - python3
        - -I
        - -S
        - -B
        - -c
        - |
          import base64, json, os, sys, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          try:
              password = os.environ["ORTHANC_PASSWORD"]
              if not password:
                  sys.exit(1)
              request = urllib.request.Request("http://127.0.0.1:8042/system")
              request.add_header("Authorization", "Basic " + base64.b64encode(("orthanc:" + password).encode()).decode())
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              with opener.open(request, timeout=5) as response:
                  body = response.read(65537)
                  if response.status != 200 or len(body) > 65536:
                      sys.exit(1)
                  data = json.loads(body)
                  if not isinstance(data, dict) or not isinstance(data.get("Version"), str) or not data["Version"]:
                      sys.exit(1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
