# Module compose for the Citadel nvr camera-NVR stack (aceteam-ai/citadel-cli#597).
#
# Three services:
#   - wyze-bridge:  Wyze TUTK P2P -> RTSP. MUST use host networking (see below).
#   - nvr-config:   init container (runs to completion first) that GENERATES
#                   /config/config.yml and VERIFIES a nas /media mount.
#   - frigate:      continuous recording + local object detection.
#
# Frigate's /config/config.yml is NOT static: its detector block, retention, and
# camera list are assignment/runtime inputs. The nvr-config init container
# (ghcr.io/aceteam-ai/nvr-config, built from cmd/nvrconfig via
# services/nvr-service/Dockerfile) generates it with the SAME tested Go logic
# citadel uses (internal/nvr.GenerateFrigateConfig), baking in every scar: the
# explicit openvino model: path (Frigate 0.17 crashes without it), ffmpeg
# preset-vaapi, the MIGRATED record.continuous.days key, and no transcode.
#
# Host ports come from citadel's registry (services/ports.go): 8212 (host) -> 5000
# (Frigate's native web port), injected as CITADEL_FRIGATE_HOST_PORT. The config +
# media host paths are FIXED at ~/.citadel-cli/nvr/{config,media} (compose expands
# a leading ~). /config is ALWAYS local — SQLite corrupts over NFS. For
# storage.mode=nas the operator/reconcile NFS-mounts the surveillance share ONTO
# ~/.citadel-cli/nvr/media BEFORE assigning the module; nvr-config then statfs-
# verifies /media is a real, root-writable network mount and REFUSES to start
# otherwise, so recordings never silently land on the local disk.
#
# Security upgrade (#1357): a CLI binary update alone does NOT repair the live
# host config or replace an already-running init image. An operator-approved
# module update/start must install this compose AND recreate/run the updated
# nvr-config init container. It first restricts /config to 0700 and both legacy
# config.yml/config.yaml to 0600 (even if later validation fails), then atomically
# replaces config.yml without MQTT credentials. Until that init step runs, an
# old 0644 file remains exposed. The catalog copy in citadel-services must also
# be updated before a catalog-installed module can receive this repair. No live
# restart or rollout is implied by merging source.
#
# Identity: nvr-config's Dockerfile and Frigate v0.17.0's final Dockerfile/service
# entrypoint both use container root; neither service overrides user here. That
# shared uid can read 0600/0700. Non-root/userns overrides need matching ownership,
# not broader modes. The :stable tag is floating, NOT a verified digest pin;
# exact-image/uid acceptance remains an operator-owned rollout gate.
# Environment substitution reference (MQTT user/password and RTSP supported):
# https://docs.frigate.video/configuration/config/#environment-variable-substitution
# https://github.com/blakeblackshear/frigate/blob/v0.17.0/frigate/config/mqtt.py
# Current RTSP URLs use a fixed bridge host and stream paths, with no separate
# credential inputs. Wyze secrets remain exclusively in wyze-bridge's env.
services:
  wyze-bridge:
    image: docker.io/idisposablegithub365/wyze-bridge:latest
    container_name: citadel-nvr-wyze-bridge
    # HOST NETWORKING IS MANDATORY AND NON-NEGOTIABLE. TUTK P2P needs LAN broadcast
    # + UDP hole-punching; Docker bridge NAT breaks camera discovery and EVERY
    # camera fails with "wyze: connect failed: discovery timeout". With host net,
    # wyze-bridge binds its RTSP server on the host at :8554 (reserved in
    # services/ports.go as WyzeBridgeRTSPPort); frigate pulls from there via the
    # host-gateway alias. Because of host networking there is NO `ports:` block
    # (host networking + published ports is a compose error).
    network_mode: host
    environment:
      # Wyze credentials come from the assignment (SECRETS; never logged). Only
      # this container ever sees them.
      - WYZE_EMAIL=${WYZE_EMAIL:?nvr requires WYZE_EMAIL}
      - WYZE_PASSWORD=${WYZE_PASSWORD:?nvr requires WYZE_PASSWORD}
      - API_ID=${API_ID:?nvr requires API_ID}
      - API_KEY=${API_KEY:?nvr requires API_KEY}
      # Keep streams always-on so continuous recording never misses frames.
      - ON_DEMAND=False
      # Record raw H.264 — do NOT transcode. The cameras already emit ~1 Mbit/s
      # H.264; re-encoding (even cheap iGPU HEVC) produces LARGER files.
      - WB_FFMPEG=False
    volumes:
      - ~/.citadel-cli/nvr/wyze-tokens:/tokens
    # NO container healthcheck here, deliberately (aceteam-ai/citadel-cli#1295).
    # The failure mode is PER-CAMERA, not whole-container: when a Wyze camera
    # power-cycles the bridge stays "Up" and healthy-looking while that one
    # stream is wedged on a dead TUTK P2P session, so a container healthcheck
    # cannot see it (and plain docker/compose does not restart on `unhealthy`
    # anyway). Recovery is WORKER-SIDE instead: `citadel work` polls Frigate's
    # /api/stats over loopback, detects a camera stalled at camera_fps == 0 for
    # N minutes, and restarts this container through its own runtime seam with
    # per-camera exponential backoff (so an unplugged camera does not loop).
    # See internal/nvr/selfheal.go. `restart: unless-stopped` still covers a
    # whole-container crash.
    restart: unless-stopped

  nvr-config:
    image: ghcr.io/aceteam-ai/nvr-config:latest
    # Fetch security fixes for this floating init image on an approved module
    # start/update, even when an older :latest is cached locally (#1357).
    pull_policy: always
    container_name: citadel-nvr-config
    # An init step, not a long-running service: it writes config.yml + verifies the
    # nas mount, then exits. frigate waits for it to complete successfully.
    restart: "no"
    environment:
      - NVR_DETECTOR=${NVR_DETECTOR:-openvino}
      - NVR_RETENTION_DAYS=${NVR_RETENTION_DAYS:-12}
      - NVR_STORAGE_MODE=${NVR_STORAGE_MODE:-local}
      - NVR_STORAGE_TARGET=${NVR_STORAGE_TARGET:-}
      # Frigate semantic search + tracked objects (#1039). These now survive a
      # reconcile (the generator owns them) instead of being clobbered when set by
      # hand / via Frigate's config UI. The two are COUPLED: semantic search only
      # embeds thumbnails of TRACKED objects, so enabling search while only `person`
      # is tracked embeds nothing else. reindex is NOT emitted (it is a CPU-heavy
      # one-shot done manually via Frigate's UI; a static reindex:true would re-run
      # on every reconcile). Embeddings persist in /config (SQLite), not config.yml.
      - NVR_SEMANTIC_SEARCH=${NVR_SEMANTIC_SEARCH:-false}
      - NVR_TRACK_OBJECTS=${NVR_TRACK_OBJECTS:-person}
      - NVR_CAMERAS=${NVR_CAMERAS:?nvr requires NVR_CAMERAS (comma-separated camera stream names)}
      # MQTT is Frigate's only real-time event egress (it has no generic outbound
      # webhook), so the module runs a broker and points Frigate at it by default.
      # Set NVR_MQTT=false to opt out.
      - NVR_MQTT=${NVR_MQTT:-true}
      - NVR_MQTT_HOST=mosquitto
      - NVR_MQTT_USER=${NVR_MQTT_USER:-frigate}
      - NVR_MQTT_PASSWORD=${NVR_MQTT_PASSWORD:?nvr requires NVR_MQTT_PASSWORD (mosquitto allows anonymous access by default)}
    volumes:
      - ~/.citadel-cli/nvr/config:/config
      - ~/.citadel-cli/nvr/media:/media

  mosquitto:
    image: docker.io/eclipse-mosquitto:2
    container_name: citadel-nvr-mosquitto
    # DELIBERATELY NO `ports:` BLOCK. The broker is reachable only on this
    # module's compose network, never from the host, the LAN, or the fabric.
    # Binding 127.0.0.1 would NOT be equivalent: wyze-bridge runs with host
    # networking in this module, so a bound port would be LAN-reachable.
    #
    # Why node-local rather than one shared broker for the fabric (#637):
    # Frigate publishes at QoS 0 (fire-and-forget), so a WAN broker blip drops
    # events silently; a shared bus would be a second control plane to secure
    # (TLS/credentials/ACLs) when the citadel worker already holds an
    # authenticated outbound channel; and cross-tenant topic isolation would
    # become security-critical on a tailnet that is currently flat across orgs.
    entrypoint:
      # Mosquitto allows ANONYMOUS access by default. Generate a password file
      # from the assignment credentials at start, then run with it. Written to a
      # tmpfs so the credential never lands on disk.
      - /bin/sh
      - -c
      - |
        set -e
        mosquitto_passwd -c -b /mosquitto/secrets/passwd "$$NVR_MQTT_USER" "$$NVR_MQTT_PASSWORD"
        cat > /mosquitto/config/mosquitto.conf <<CONF
        listener 1883
        allow_anonymous false
        password_file /mosquitto/secrets/passwd
        persistence false
        CONF
        # mosquitto drops to the unprivileged `mosquitto` user, so it cannot read
        # the root-owned files we just wrote into the tmpfs -- without this it
        # exits with 'Unable to open pwfile' and the module never starts.
        chown -R mosquitto:mosquitto /mosquitto/secrets /mosquitto/config
        chmod 0600 /mosquitto/secrets/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    environment:
      - NVR_MQTT_USER=${NVR_MQTT_USER:-frigate}
      - NVR_MQTT_PASSWORD=${NVR_MQTT_PASSWORD:?nvr requires NVR_MQTT_PASSWORD (mosquitto allows anonymous access by default)}
    tmpfs:
      - /mosquitto/secrets
      - /mosquitto/config
    restart: unless-stopped

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: citadel-nvr-frigate
    depends_on:
      wyze-bridge:
        condition: service_started
      mosquitto:
        condition: service_started
      nvr-config:
        # Frigate must not start until config.yml exists and the nas mount (if any)
        # is verified.
        condition: service_completed_successfully
    # Frigate decodes frames into /dev/shm; the 64MB default is far too small.
    # /dev/shm carries RAW DECODED frames between the capture and detect
    # processes (a 1080p YUV420 frame is ~3MB, buffered ~9 deep per camera), so
    # it scales with cameras x resolution, NOT with the compressed bitrate.
    # 256mb was too small for 3x1080p: Frigate warned it needed >=306MB and
    # measured steady-state use was 322MB (#637). Undersizing causes frame-write
    # failures and capture-process restart loops, not merely slowness. This is a
    # tmpfs CAP, not a reservation: unused headroom costs no RAM.
    shm_size: 512mb
    devices:
      # Intel iGPU render node for hardware decode (preset-vaapi) + OpenVINO
      # detection. Matches sandbox.devices in service.yaml.
      - /dev/dri/renderD128:/dev/dri/renderD128
    extra_hosts:
      # Lets frigate (bridge network) reach the host-networked wyze-bridge RTSP
      # server at host.docker.internal:8554.
      - "host.docker.internal:host-gateway"
    ports:
      # host 8212 -> container 5000 (Frigate web UI/API). Host port owned by citadel
      # (services/ports.go); the :? guard fails loudly if it was not injected.
      - "${CITADEL_FRIGATE_HOST_PORT:?citadel must supply CITADEL_FRIGATE_HOST_PORT}:5000"
    volumes:
      # /config (config.yml + SQLite DB) is ALWAYS local disk — SQLite corrupts
      # over NFS. nvr-config wrote config.yml here before start.
      - ~/.citadel-cli/nvr/config:/config
      # /media follows the storage target. FIXED bind source; for nas mode the
      # share is mounted onto this host path and nvr-config already verified it.
      - ~/.citadel-cli/nvr/media:/media
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-UTC}
      # The generated YAML contains only placeholders, never these values.
      # Keep broker and Frigate credentials sourced from the same assignment.
      - FRIGATE_MQTT_USER=${NVR_MQTT_USER:-frigate}
      - FRIGATE_MQTT_PASSWORD=${NVR_MQTT_PASSWORD:?nvr requires NVR_MQTT_PASSWORD (mosquitto allows anonymous access by default)}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
