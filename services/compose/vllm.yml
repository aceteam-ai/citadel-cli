# services/compose/vllm.yml

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: citadel-vllm
    # Host port is owned by citadel (services/ports.go), supplied via
    # CITADEL_VLLM_HOST_PORT. Loopback-only publish (127.0.0.1), deliberately
    # (aceteam-ai/aceteam#9523): this is an OpenAI-compatible vLLM server with
    # NO auth of its own, and the "peers reach this engine directly over the
    # mesh" rationale a prior version of this comment gave does not hold on an
    # embedded-tsnet node -- citadel's userspace netstack never forwards
    # inbound mesh traffic to a host-bound port it did not explicitly
    # ListenVPN (see CLAUDE.md's "Chat reachability" note), so the 0.0.0.0
    # bind bought LAN reach, not mesh reach, on the common node topology. Mesh
    # reach stays available through the gateway's model-routed
    # /v1/chat/completions (internal/gateway/chat_route.go), which resolves
    # the model to this engine and reverse-proxies to 127.0.0.1 itself -- so
    # this bind change does not affect it. The bare `${CITADEL_VLLM_HOST_PORT}`
    # token below (no `:?`/`:-` guard) mirrors kokoro.yml/omnivoice.yml: a
    # guard's own colons would smear across the loopback host-port parsers in
    # services/embed_test.go and internal/apps/hostport_collision_test.go, and
    # citadel ALWAYS injects the var (services.HostPortEnv) at every
    # `docker compose up` site, so it resolves; do not add a default/guard back.
    ports:
      - "127.0.0.1:${CITADEL_VLLM_HOST_PORT}:8000"
    volumes:
      - ~/citadel-cache/huggingface:/root/.cache/huggingface
    # The served model is interpolated from VLLM_MODEL so a SERVICE_START job
    # carrying a "model" payload can swap it (#530). Citadel persists the choice
    # to a sibling vllm.env passed via --env-file (see internal/compose/envfile.go);
    # the :- default keeps standalone `docker compose up` working unchanged.
    #
    # --trust-remote-code is OPT-IN ONLY (citadel#848): it executes arbitrary
    # Python shipped in the model repo, so it must never be unconditionally
    # baked in here. ${VLLM_TRUST_REMOTE_CODE:+--trust-remote-code} expands to
    # the flag only when that var is set to a non-empty value; unset (the
    # default) it expands to nothing, so the compose command-line shell-word
    # split drops it and this line is a no-op -- byte-identical behavior to
    # before this flag existed. Set VLLM_TRUST_REMOTE_CODE=1 in the sibling
    # vllm.env (see internal/compose/envfile.go) to enable it for a node/model
    # that requires custom code (e.g. gte-multilingual-base, some Qwen/InternLM).
    command: >-
      --host 0.0.0.0
      --port 8000
      --model ${VLLM_MODEL:-Qwen/Qwen3-8B}
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --max-model-len 16384
      --gpu-memory-utilization 0.85
      --enforce-eager
      ${VLLM_TRUST_REMOTE_CODE:+--trust-remote-code}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
