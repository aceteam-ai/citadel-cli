# services/compose/bonsai.yml
#
# Serves PrismML's Bonsai-27B (1-bit quantized Qwen3.6-27B) via an
# OpenAI-compatible llama-server built from the PrismML fork of llama.cpp
# (see services/compose/bonsai/Dockerfile). The 1-bit GGUF is ~3.8GB and fits an
# RTX 3090 (24GB) easily (~5-12GB VRAM incl. KV cache by context length).
#
# UNLIKE every other embedded service (llamacpp, vllm, diffusers, ...), which
# pull a prebuilt `image:`, bonsai BUILDS its image from a Dockerfile because no
# prebuilt image for the fork is published. The `build.context: ./bonsai` is
# relative to this compose file's directory; citadel materializes the Dockerfile
# to <config>/services/bonsai/Dockerfile via services.WriteAuxFiles so the build
# resolves on the node.
#
# Model file: MODEL_CACHE_PULL for engine "bonsai" downloads exactly
# Bonsai-27B-Q1_0.gguf from prism-ml/Bonsai-27B-gguf into ~/citadel-cache/bonsai
# (huggingface-cli ... --local-dir), which is mounted below at /models. Override
# the served file with BONSAI_MODEL (e.g. a different quant) the same way vllm
# uses VLLM_MODEL.

services:
  bonsai:
    build:
      context: ./bonsai
      dockerfile: Dockerfile
    image: citadel-bonsai:local
    container_name: citadel-bonsai
    # Host port is owned by citadel (services/ports.go), supplied via
    # CITADEL_BONSAI_HOST_PORT. Loopback-only publish (127.0.0.1),
    # deliberately (aceteam-ai/aceteam#9523): this is an OpenAI-compatible
    # llama-server with NO auth of its own, and the "peers reach this engine
    # directly over the mesh" rationale a prior version of this comment gave
    # does not hold on an embedded-tsnet node -- self-dialing this node's own
    # mesh IP:8210 while bonsai served fine on localhost:8210 returned
    # "connection refused" (see CLAUDE.md's "Chat reachability" note): citadel's
    # userspace netstack never forwards inbound mesh traffic to a host-bound
    # port it did not explicitly ListenVPN, so the 0.0.0.0 bind bought LAN
    # reach, not mesh reach, on the common node topology. Mesh reach stays
    # available through the gateway's model-routed /v1/chat/completions
    # (internal/gateway/chat_route.go), which resolves the model to this
    # engine and reverse-proxies to 127.0.0.1 itself -- so this bind change
    # does not affect it. The bare `${CITADEL_BONSAI_HOST_PORT}` token below
    # (no `:?`/`:-` guard) mirrors kokoro.yml/omnivoice.yml: a guard's own
    # colons would smear across the loopback host-port parsers in
    # services/embed_test.go and internal/apps/hostport_collision_test.go, and
    # citadel ALWAYS injects the var (services.HostPortEnv) at every
    # `docker compose up` site, so it resolves; do not add a default/guard back.
    ports:
      - "127.0.0.1:${CITADEL_BONSAI_HOST_PORT}:8080"
    volumes:
      # MODEL_CACHE_PULL (engine=bonsai) drops Bonsai-27B-Q1_0.gguf here.
      - ~/citadel-cache/bonsai:/models
    # -ngl 99 offloads all layers to the GPU (the card's recommended command).
    #
    # VRAM tuning (citadel #567): without --ctx-size, llama-server allocates the
    # model's full training context (Bonsai = 262144 tokens), whose KV cache alone
    # is ~17GB — the 3.9GB model then pins ~21GB VRAM. --ctx-size ${BONSAI_CTX:-8192}
    # bounds context (32x smaller → ~0.5GB KV), and 4-bit KV quant trims it further.
    # Quantized V-cache (--cache-type-v q4_0) requires flash attention, so
    # --flash-attn on is mandatory here (verified: the PrismML fork's llama-server
    # accepts -fa/-ctk/-ctv, and -fa takes an [on|off|auto] value). Net: ~5-6GB VRAM
    # at the default 8192 context. Override the context with BONSAI_CTX.
    command: >-
      --host 0.0.0.0
      --port 8080
      --model /models/${BONSAI_MODEL:-Bonsai-27B-Q1_0.gguf}
      -ngl 99
      --ctx-size ${BONSAI_CTX:-8192}
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
