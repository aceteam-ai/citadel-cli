# services/compose/llamacpp.yml

services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: citadel-llamacpp
    # Host port is owned by citadel (services/ports.go), supplied via
    # CITADEL_LLAMACPP_HOST_PORT. Loopback-only publish (127.0.0.1),
    # deliberately (aceteam-ai/aceteam#9523): this is an OpenAI-compatible
    # llama.cpp server with NO auth of its own, and the "peers reach this
    # engine directly over the mesh" rationale a prior version of this comment
    # gave does not hold on an embedded-tsnet node -- citadel's userspace
    # netstack never forwards inbound mesh traffic to a host-bound port it did
    # not explicitly ListenVPN (see CLAUDE.md's "Chat reachability" note), so
    # the 0.0.0.0 bind bought LAN reach, not mesh reach, on the common node
    # topology (`citadel expose --check` will now correctly report this
    # engine as unreachable from a peer, which is the intended effect, not a
    # regression). Mesh reach stays available through the gateway's
    # model-routed /v1/chat/completions (internal/gateway/chat_route.go),
    # which resolves the model to this engine and reverse-proxies to
    # 127.0.0.1 itself -- so this bind change does not affect it. The bare
    # `${CITADEL_LLAMACPP_HOST_PORT}` token below (no `:?`/`:-` guard) mirrors
    # kokoro.yml/omnivoice.yml: a guard's own colons would smear across the
    # loopback host-port parsers in services/embed_test.go and
    # internal/apps/hostport_collision_test.go, and citadel ALWAYS injects the
    # var (services.HostPortEnv) at every `docker compose up` site, so it
    # resolves; do not add a default/guard back.
    ports:
      - "127.0.0.1:${CITADEL_LLAMACPP_HOST_PORT}:8080"
    volumes:
      - ~/citadel-cache/llamacpp:/models
    # LLAMACPP_MODEL (citadel-cli#685 §1a) optionally points the server at a
    # specific GGUF under /models (the cache mount above), mirroring bonsai's
    # BONSAI_MODEL / vllm's VLLM_MODEL. Unlike those, llamacpp is a
    # bring-your-own-GGUF engine with no single stable default file, so the
    # flag is OMITTED entirely when unset rather than defaulting to a
    # filename that might not exist on this node -- the server then starts in
    # llama.cpp's own router/deferred-load mode (see internal/status/models.go's
    # DiscoverModels comment on that mode).
    #
    # Deliberately built from THREE independent, non-nested substitutions
    # rather than one `${LLAMACPP_MODEL:+--model /models/$LLAMACPP_MODEL}`
    # (an earlier version of this file used that form): whether compose's
    # interpolation engine recursively expands a bare $VAR reference living
    # INSIDE another substitution's alt-text is implementation-defined, and
    # this repo has no test that renders a compose file to pin the answer, so
    # a change of compose implementation could silently regress the SET case
    # (LLAMACPP_MODEL literally passed through unexpanded, and llama-server
    # failing to start) while the UNSET case kept working -- the one case
    # this fix exists for. Each piece below is a single top-level `${VAR}` or
    # a `${VAR:+literal}` with no variable reference in its alt-text, which
    # is unambiguous under any compose interpolation implementation:
    #   unset  -> "" "" ""                       -> (no --model flag)
    #   set=x  -> "--model" "/models/" "x"        -> --model /models/x
    command: >-
      --host 0.0.0.0
      --port 8080
      ${LLAMACPP_MODEL:+--model} ${LLAMACPP_MODEL:+/models/}${LLAMACPP_MODEL}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
