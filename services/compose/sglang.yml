# services/compose/sglang.yml

services:
  sglang:
    image: lmsysorg/sglang:latest
    container_name: citadel-sglang
    # Loopback-only publish (127.0.0.1), deliberately (aceteam-ai/aceteam#9523):
    # this is an OpenAI-compatible server with no auth of its own. Unlike
    # vllm/llamacpp/bonsai/unlimited-ocr, sglang's host port (30000, see
    # services.SGLangHostPort) is not deferred through a citadel-injected
    # ${CITADEL_*_HOST_PORT} var, so the loopback literal here is the whole
    # fix -- there is no env-var-guard interaction to worry about. Mesh reach
    # stays available through the gateway's model-routed
    # /v1/chat/completions (internal/gateway/chat_route.go), which resolves
    # the model to this engine and reverse-proxies to 127.0.0.1 itself.
    ports:
      - "127.0.0.1:30000:30000"
    volumes:
      # Mount a user-accessible directory to cache Hugging Face models
      - ~/citadel-cache/huggingface:/root/.cache/huggingface
    # Use an environment variable for the command.
    # The part after the colon is the default if the variable isn't set.
    # Users should set SGLANG_COMMAND to include --model-path, e.g.:
    # SGLANG_COMMAND="python3 -m sglang.launch_server --model-path meta-llama/Llama-3.1-8B-Instruct --host 0.0.0.0 --port 30000"
    command: ${SGLANG_COMMAND:-python3 -m sglang.launch_server --host 0.0.0.0 --port 30000}
    ipc: host
    shm_size: "32g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
