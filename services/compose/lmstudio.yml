# services/compose/lmstudio.yml

services:
  lmstudio:
    image: technovangelist/lm-studio:latest
    container_name: citadel-lmstudio
    # Loopback-only publish (127.0.0.1) by default (aceteam-ai/citadel-cli#1060,
    # completing the aceteam-ai/aceteam#9523 sweep): same no-auth OpenAI-compatible
    # shape as the other engines, defaulted to loopback for safety. The host port
    # stays the literal 1234 (no citadel-injected host-port var, same as sglang).
    # NOTE: this engine's pinned image does not currently exist on Docker Hub, so
    # no container can actually run (aceteam-ai/citadel-cli#1066 tracks fixing the
    # image or retiring the engine); this loopback default is inert until a real,
    # pullable image is chosen, at which point loopback is already the safe bind.
    #
    # The `${CITADEL_LMSTUDIO_BIND:-127.0.0.1}` IP prefix is the #1023 escape
    # hatch: the bind defaults to loopback, but `bind: all` on this service in
    # citadel.yaml makes citadel inject CITADEL_LMSTUDIO_BIND=0.0.0.0 at `up`
    # (services.BindEnv). Unset, the `:-127.0.0.1` default keeps loopback.
    # services.ResolvePortSpecBind is the authority.
    ports:
      - "${CITADEL_LMSTUDIO_BIND:-127.0.0.1}:1234:1234"
    volumes:
      # Mount a user-accessible directory for LM Studio's cache and models
      - ~/citadel-cache/lmstudio:/root/.cache/lm-studio
    environment:
      - DOCKER=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
