services:
  transcribe:
    image: ghcr.io/aceteam-ai/whisper-service:latest
    container_name: citadel-transcribe
    # Loopback-only publish (127.0.0.1) by default (aceteam-ai/citadel-cli#1060,
    # completing the aceteam-ai/aceteam#9523 sweep): the whisper sidecar has NO
    # auth of its own and its only consumer is a HOST process
    # (internal/jobs/transcribe_audio.go dials http://localhost:8101), so the
    # prior 0.0.0.0 bind bought LAN reach, not mesh reach, on the common
    # embedded-tsnet node (see vllm.yml and CLAUDE.md's "Chat reachability"
    # note). The host port stays the literal 8101 (transcribe has no
    # citadel-injected host-port var, same as sglang's 30000).
    #
    # The `${CITADEL_TRANSCRIBE_BIND:-127.0.0.1}` IP prefix is the #1023 escape
    # hatch: the bind defaults to loopback, but `bind: all` on this service in
    # citadel.yaml makes citadel inject CITADEL_TRANSCRIBE_BIND=0.0.0.0 at `up`
    # (services.BindEnv). Unset, the `:-127.0.0.1` default keeps loopback
    # byte-identical. services.ResolvePortSpecBind is the authority.
    ports:
      - "${CITADEL_TRANSCRIBE_BIND:-127.0.0.1}:8101:8101"
    volumes:
      # faster-whisper model cache (shared with other HF-based services).
      - ~/citadel-cache/huggingface:/root/.cache/huggingface
      # Mount the node workspace read-only so the service can read audio files
      # that FILE_WRITE_BYTES placed there.
      # CITADEL_WORKSPACE must be an ABSOLUTE path (Docker Compose does NOT
      # expand "~"). When this service is started via SERVICE_START, the
      # citadel-cli worker exports CITADEL_WORKSPACE automatically, set to the
      # same absolute workspace it writes job files into. The :? guard makes a
      # manual `docker compose up` without the var fail loudly rather than
      # silently mounting the wrong path. To run by hand set e.g.
      #   CITADEL_WORKSPACE=/home/<user>/citadel-node/workspace
      - ${CITADEL_WORKSPACE:?set CITADEL_WORKSPACE to an absolute workspace path}:/workspace:ro
    environment:
      # faster-whisper DEFAULT model size: base = good CPU speed/accuracy
      # tradeoff. A TRANSCRIBE_AUDIO job may override this per-request via the
      # `model_size` param (citadel#1045); the sidecar loads the requested model
      # on demand and caches one at a time. This env var is only the fallback
      # when no per-request model_size is given.
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - PORT=8101
    restart: unless-stopped
