# services/compose/diffusers.yml
#
# Node-local text-to-image / text-to-video serving via the HuggingFace
# diffusers library. Launched on a node by SERVICE_START "diffusers" (aceteam
# #4468). The image is our own diffusers sidecar (services/diffusers-service),
# which serves /generate (image) and /generate/video (citadel #958, video)
# endpoints plus a /health check on the diffusers contract port 7860. The two
# models/pipelines are independent (see app.py) and coexist on one container.
#
# NOTE: the container listens on 7860 (the aceteam `diffusers-text-to-image`
# template's default_port), exactly as vllm listens on 8000. The HOST port is
# owned by citadel (services/ports.go) and supplied via
# CITADEL_DIFFUSERS_HOST_PORT; the :? guard fails loudly if it is missing. It
# must NOT be the container's own 7860 (that is the citadel terminal server's
# host port) nor 8102 (the TEI embedding upstream). SERVICE_START does not pass
# a port to the container; the port contract is satisfied by the server
# listening on 7860 inside the container.

services:
  diffusers:
    image: ghcr.io/aceteam-ai/diffusers-service:latest
    container_name: citadel-diffusers
    # Host port is owned by citadel (services/ports.go), supplied via
    # CITADEL_DIFFUSERS_HOST_PORT. Loopback-only publish (127.0.0.1) by default
    # (aceteam-ai/citadel-cli#1060, completing the aceteam-ai/aceteam#9523 sweep):
    # this sidecar has NO auth of its own and its only consumer is a HOST process
    # (internal/jobs/media_generate.go dials http://localhost:<port>), so the
    # prior 0.0.0.0 bind bought LAN reach, not mesh reach, on the common
    # embedded-tsnet node (see vllm.yml and CLAUDE.md's "Chat reachability"
    # note). The bare `${CITADEL_DIFFUSERS_HOST_PORT}` token (no `:?`/`:-` guard)
    # mirrors vllm.yml: citadel ALWAYS injects the var (services.HostPortEnv) at
    # every `docker compose up` site, so it resolves.
    #
    # The `${CITADEL_DIFFUSERS_BIND:-127.0.0.1}` IP prefix is the #1023 escape
    # hatch: the bind defaults to loopback, but `bind: all` on this service in
    # citadel.yaml makes citadel inject CITADEL_DIFFUSERS_BIND=0.0.0.0 at `up`
    # (services.BindEnv). Unset, the `:-127.0.0.1` default keeps loopback
    # byte-identical. services.ResolvePortSpecBind is the authority.
    ports:
      - "${CITADEL_DIFFUSERS_BIND:-127.0.0.1}:${CITADEL_DIFFUSERS_HOST_PORT}:7860"
    volumes:
      # Share the HuggingFace model cache with the other HF-based services
      # (vllm, sglang, whisper) so weights are downloaded once per node.
      - ~/citadel-cache/huggingface:/root/.cache/huggingface
    environment:
      # Model repo id to serve. Override for SD 3.5 Medium / SDXL / etc.:
      #   DIFFUSERS_MODEL=stabilityai/stable-diffusion-3.5-medium
      - DIFFUSERS_MODEL=${DIFFUSERS_MODEL:-stabilityai/sdxl-turbo}
      # Text-to-video model repo id (citadel #958). Wan2.1's 1.3B model is the
      # default -- small enough to run alongside the image model above.
      - DIFFUSERS_VIDEO_MODEL=${DIFFUSERS_VIDEO_MODEL:-Wan-AI/Wan2.1-T2V-1.3B-Diffusers}
      - PORT=7860
      # Gated models (e.g. stabilityai/stable-diffusion-3.5-medium) require a
      # HuggingFace token. Set HF_TOKEN in the node's environment before
      # SERVICE_START; the default SDXL-Turbo is open and needs no token.
      - HF_TOKEN=${HF_TOKEN:-}
    healthcheck:
      # Hits the /health endpoint on the contract port (inside the container).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Generous start_period: a large model download on first boot can take a
      # while, and /health answers before the model finishes loading anyway.
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
