{
  "title": "Synthetic successful login selection",
  "name": "_success",
  "logsource": {
    "category": "webserver"
  },
  "detection": {
    "selection": {
      "http.request.method": "POST",
      "url.original|startswith": "/login",
      "http.response.status_code": [
        200,
        302
      ]
    },
    "condition": "selection"
  },
  "x-aceteam": {
    "escalate": false,
    "group_by": [
      "source.ip"
    ]
  }
}
