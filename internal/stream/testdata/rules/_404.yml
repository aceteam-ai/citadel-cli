{
  "title": "Synthetic not found selection",
  "name": "_404",
  "logsource": {
    "category": "webserver"
  },
  "detection": {
    "selection": {
      "http.response.status_code": 404
    },
    "condition": "selection"
  },
  "x-aceteam": {
    "escalate": false,
    "group_by": [
      "source.ip"
    ]
  }
}
