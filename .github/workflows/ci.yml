name: CI

# Build + test gate for citadel-cli. Before this, the only workflow was
# deploy-docs.yml, so PRs and pushes to main merged with zero automated
# build/test signal and a broken build could flow straight into a release via
# build.sh/release.sh. This runs gofmt, vet, build, the unit tests, and a
# cross-compile smoke for every release target on every PR and push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so a force-push or rapid pushes
# don't leave stale jobs occupying the limited self-hosted ARC runner pool.
# Push-to-main and each PR have distinct refs, so this only cancels true
# supersessions (mirrors aceteam's tests.yml / android-release.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gofmt + vet + build + unit tests. Single job: these are cheap and share the
  # same toolchain setup, so splitting them would only multiply Go-install /
  # cache-warm cost on the bare ARC pod for no real parallelism win.
  build-test:
    name: Build + Test
    # Self-hosted ARC runners ONLY. The org moved all CI onto Actions Runner
    # Controller on the Proxmox lab; GitHub-hosted runners (ubuntu-latest) are
    # not used. The pods are bare, so the Go toolchain is provisioned per-run
    # by setup-go below.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # go-version-file reads the version from go.mod (1.26.x) so CI tracks the
      # repo's Go version automatically. Module + build cache is on by default
      # in setup-go@v5, which matters on the bare pod (no warm GOMODCACHE).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fail if any tracked Go file isn't gofmt-clean. `gofmt -l .` lists the
      # offenders; we print them and exit non-zero so the log names exactly
      # which files need `gofmt -w`.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean. Run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Build the main package by explicit path. The repo ROOT carries a
      # '//go:build tools' constraint (build-time-only deps for man-page gen),
      # so `go build ./...` would try to compile that tools file; the explicit
      # ./cmd/citadel path is what build.sh ships.
      - name: go build
        run: go build ./cmd/citadel

      # Unit tests. The live-TEI test is '//go:build integration'-gated and so
      # excluded here. internal/provision/provision_test.go injects a mock
      # Docker backend and never contacts a real daemon, so it passes on the
      # bare ARC pod (which has no docker) — no skip/gate needed.
      - name: go test
        run: go test ./...

      # -race gate for internal/jobs only (not repo-wide: -race is slow and
      # other packages haven't been swept for races yet). This package hit a
      # real intra-test race (#810) that a plain `go test` never caught, so it
      # earns its own scoped, always-on race run rather than a one-off local
      # check.
      - name: go test -race (internal/jobs)
        run: go test -race ./internal/jobs/...

  # Cross-compile smoke for every release target. Catches a target that builds
  # locally but breaks on a GOOS/GOARCH the host can't run, so a release tag can
  # never fail at build.sh time after the tag is cut. -o /dev/null: we only need
  # the compile to succeed, not the artifact.
  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0 mirrors build.sh exactly (it cross-builds every target
      # with cgo off), so no C cross-toolchain / build-essential is needed on
      # the pod and the smoke matches what release actually does.
      - name: go build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/citadel

      # EVERY package, not just the shipped binary. ./cmd/citadel alone left a
      # blind spot: internal/nvr used Unix-only syscalls and broke `go build ./...`
      # for GOOS=windows for weeks (#663) while this matrix stayed green, because
      # only ./cmd/nvrconfig imports it. Releases were unaffected, which is
      # exactly what made it invisible -- the failure landed on whoever next
      # checked their own Windows build and found a break that was not theirs.
      # No -o: a multi-package build discards its output.
      - name: go build ./... ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  # Tokenizer smoke test for the diffusers sidecar (citadel-cli#829). Real
  # incident: LTX-Video's T5 tokenizer failed to construct on a live node,
  # mid-provision -- first a missing tiktoken, then a missing
  # sentencepiece/protobuf -- because nothing had ever exercised tokenizer
  # construction before the sidecar image shipped. build-diffusers-service.yml
  # deliberately does NOT build the (multi-GB, CUDA) sidecar image on PRs (see
  # that workflow's comment), so this is NOT a full-image build: it installs
  # only the pinned tokenizer-stack packages from
  # services/diffusers-service/requirements.txt (no torch/diffusers/
  # accelerate) and runs a CPU-only script that imports each pinned dep
  # directly and constructs a tokenizer for each model family the sidecar
  # serves, downloading only small tokenizer/config files -- never the
  # multi-GB weight shards a real model load would pull. See
  # services/diffusers-service/scripts/check_tokenizer_deps.py for exactly
  # what is and isn't covered (including why one probe is gated on an
  # optional HF_TOKEN secret that this repo does not currently define, and why
  # the tier-2 probes only ever SKIP -- never fail -- on a network/HF problem).
  #
  # Path-filtered so it only does real work when the sidecar source or this
  # workflow file changes -- same "don't tax unrelated PRs" reasoning
  # build-diffusers-service.yml documents, but a different mechanism: that
  # workflow uses a workflow-level `on.push.paths` filter and doesn't trigger
  # on pull_request at all, whereas ci.yml runs on every PR/push and this job
  # instead uses a step-level `dorny/paths-filter` (below) to skip its own
  # steps when nothing under services/diffusers-service/** changed.
  diffusers-tokenizer-smoke:
    name: Diffusers sidecar tokenizer smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check for sidecar changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sidecar:
              - 'services/diffusers-service/**'
              - '.github/workflows/ci.yml'

      - name: Set up Python
        if: steps.changes.outputs.sidecar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned tokenizer-stack deps
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/diffusers-service
        run: |
          python -m pip install --upgrade pip
          # Install only the tokenizer-relevant subset of requirements.txt --
          # sourced from the pinned file itself (not restated here) so this
          # step can never drift from the versions the sidecar image actually
          # ships. Deliberately skips torch/diffusers/accelerate: this is a
          # CPU-only tokenizer test, not a model-load test.
          deps="$(grep -E '^(transformers|sentencepiece|protobuf|tiktoken|ftfy)==' requirements.txt)"
          echo "$deps"
          pip install $deps

      - name: Tokenizer construction smoke test
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/diffusers-service
        # HF_TOKEN is optional and not currently defined as a repo secret;
        # when absent the script skips (not fails) the one probe that needs
        # it (SD 3.5 Medium is HF-gated). Tier 2 as a whole only ever SKIPS on
        # a network/HF problem -- see the script's module docstring for why
        # that's deliberate and what stays a hard, offline gate (tier 1, plus
        # the tier-2 dependency-shaped-failure path exercised by
        # Lightricks/LTX-Video, the model this issue is actually about).
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/check_tokenizer_deps.py

      # citadel #902: model_preflight.py's free-space preflight + prefetch
      # guard is deliberately import-light (huggingface_hub only, no
      # diffusers/torch/fastapi -- see the module docstring), so its tests
      # run hermetically in a plain pytest install, no other sidecar deps
      # needed. Same path-filter as the tokenizer-stack step above.
      - name: Install pytest
        if: steps.changes.outputs.sidecar == 'true'
        run: python -m pip install --quiet pytest

      - name: Model preflight unit tests
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/diffusers-service
        run: python -m pytest test_model_preflight.py -v

      # citadel #958: test_app.py exercises app.py's HTTP contract for both
      # /generate (image, pre-existing) and /generate/video (text-to-video)
      # with the pipeline load functions monkeypatched -- see that file's
      # module docstring. Needs fastapi/pydantic (+ httpx, for Starlette's
      # TestClient) but deliberately NOT torch/diffusers/accelerate/imageio:
      # app.py only imports those lazily, inside the very functions this
      # suite mocks out. Sourced from requirements.txt (not restated here)
      # for the same drift-proofing reason as the tokenizer-stack step above.
      - name: Install app test deps (fastapi/pydantic, no torch/diffusers)
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/diffusers-service
        run: |
          deps="$(grep -E '^(fastapi|pydantic)==' requirements.txt)"
          echo "$deps"
          pip install $deps httpx

      - name: App contract tests (image + video paths, pipeline mocked)
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/diffusers-service
        run: python -m pytest test_app.py -v
