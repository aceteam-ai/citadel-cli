name: CI

# Build + test gate for citadel-cli. Before this, the only workflow was
# deploy-docs.yml, so PRs and pushes to main merged with zero automated
# build/test signal and a broken build could flow straight into a release via
# build.sh/release.sh. This runs gofmt, vet, build, the unit tests, and a
# cross-compile smoke for every release target on every PR and push to main.
on:
  push:
    branches: [main]
  pull_request:
    # Dependent PRs are stacked: a child opens against its parent's branch
    # and is retargeted to main before the parent merges. These patterns give
    # a stacked child the same gates as a PR against main, including the
    # windows-latest job below. Other bases (for example a release or
    # personal branch) still get no PR CI.
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'chore/**']

# Cancel superseded runs on the same branch/PR so a force-push or rapid pushes
# don't leave stale jobs occupying the limited self-hosted ARC runner pool.
# Push-to-main and each PR have distinct refs, so this only cancels true
# supersessions (mirrors aceteam's tests.yml / android-release.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gofmt + vet + build + race + python replays. The unit tests live in the
  # `test` shards below; `Build + Test` (last job in this group) aggregates them.
  check:
    name: Lint + build + race
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # go-version-file reads the version from go.mod so CI tracks the repo's Go
      # version. Module + build cache is keyed on go.sum by setup-go.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fail if the shard plan does not cover every package (and every
      # internal/platform Test function) exactly once.
      - name: Test shard plan covers every package
        run: python3 -I scripts/ci_test_shards.py check

      # Fail if any tracked Go file isn't gofmt-clean. `gofmt -l .` lists the
      # offenders; we print them and exit non-zero so the log names exactly
      # which files need `gofmt -w`.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean. Run 'gofmt -w .':"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Release orchestration offline regressions
        run: python3 -I -B -m unittest discover -s scripts -p 'test_release_*.py'

      - name: go vet
        run: go vet ./...

      # Build the main package by explicit path. The repo ROOT carries a
      # '//go:build tools' constraint (build-time-only deps for man-page gen),
      # so `go build ./...` would try to compile that tools file; the explicit
      # ./cmd/citadel path is what build.sh ships.
      - name: go build
        run: go build ./cmd/citadel

      - name: Media input contract replay (Python stdlib only)
        run: python3 -I -B -m unittest discover -s internal/mediainput -p test_contract.py

      - name: Point-cloud codec replay (Python stdlib only)
        run: python3 -I -B -m unittest discover -s internal/pointcloud -p test_codec.py

      # -race gate for internal/jobs only (not repo-wide: -race is slow and
      # other packages haven't been swept for races yet). This package hit a
      # real intra-test race (#810) that a plain `go test` never caught, so it
      # earns its own scoped, always-on race run rather than a one-off local
      # check.
      - name: go test -race (internal/jobs)
        run: go test -race ./internal/jobs/...

  # Unit tests (`go test ./...` before sharding). The live-TEI test is
  # '//go:build integration'-gated and so excluded. internal/provision injects
  # a mock Docker backend and never contacts a real daemon. The package-to-shard
  # plan is scripts/ci_test_shards.py (balanced on measured package times;
  # internal/platform is split by test name because it alone is ~7.5 minutes).
  test:
    name: Test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test (shard ${{ matrix.shard }})
        run: python3 -I scripts/ci_test_shards.py run ${{ matrix.shard }}

  # The required status check. Branch protection requires a check named exactly
  # "Build + Test", so this job keeps that name and reports for the whole group.
  # `if: always()` plus an explicit result check means a failed, cancelled or
  # skipped dependency fails this job instead of skipping it (a skipped required
  # check can count as passing).
  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    if: always()
    needs: [check, test, macos-cobrowse]
    steps:
      - name: All build and test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a Build + Test dependency did not succeed ($r)"
              exit 1
            fi
          done

  # macOS co-browse gate (citadel-cli#1903, #1909). Runs the darwin-tagged
  # host-runner, session-dir and local-mode tests on GitHub-hosted macos-latest.
  # It is a Build + Test dependency (#1913), so a red run blocks merging.
  macos-cobrowse:
    name: macOS co-browse (unit)
    runs-on: macos-latest
    # A hung job would otherwise hold Build + Test for the 6-hour default.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet (local-mode packages)
        run: go vet ./internal/platform/ ./internal/localcobrowse/ ./internal/localviewer/ ./internal/localaudit/ ./internal/cobrowsestream/ ./internal/cobrowseprofile/ ./internal/nodevault/ ./internal/browserurl/

      # The macOS host runner (#1635): discovery, the owner start-time token,
      # the verified process-group kill and the session-dir trust checks. The
      # darwin-tagged tests only run here. A pattern with no matching test yet
      # passes, so this step is live as each macOS slice lands.
      - name: macOS runner and session dirs (darwin-only paths)
        run: go test ./internal/platform/ -count=1 -run '^(TestMac|TestDarwin|TestValidatePrivateSessionDir|TestBuildChromeArgs|TestCobrowse|TestSweep|TestOrphan)'

      - name: Local co-browse service, owner lock, viewer and audit log
        run: go test ./internal/localcobrowse/... ./internal/localviewer/ ./internal/localaudit/ -count=1

      - name: Saved-logins profile store and at-rest passphrase
        run: |
          go test ./internal/cobrowseprofile/ -count=1
          go test ./internal/nodevault/ -count=1 -run '^(TestAtRest|TestSetPassphrase|TestUnlockAtRest|TestChangePassphrase|TestWeakSecret|TestRemoveKeeps|TestNonFinitePolicy|TestSavePolicyRejects)'

      - name: Egress guard (darwin route data)
        run: go test ./internal/browserurl/ -count=1

      - name: citadel local mcp and doctor
        run: go test ./cmd/ -count=1 -run '^(TestHarnessPaths|TestRenderBlocks|TestMerge|TestRunLocalConfig|TestDetectHarness|TestLocalDoctor|TestLocalAudit|TestLocalMCP|TestLocalMode|TestLocalViewer|TestNewLocalMCPTools|TestLocalToolNamesDoNotCollide|TestNoLocalMCPToolCanApprove|TestLocalPassphrase|TestLocalProfileStore|TestLocalStoreDirsArePrivate|TestSignalDuringClose)'

  # Windows co-browse gate (aceteam#13503 local mode, citadel-cli#1548). The
  # jobs above only cross-compile for Windows, so before this no co-browse code
  # had ever run there. GitHub-hosted windows-latest (free for a public repo),
  # not the self-hosted pool; no artifacts are uploaded.
  #
  # Unit tests run a Windows-portable subset of internal/platform: several older
  # tests in that package exercise Linux-only paths (/proc, Xvfb, sh) and were
  # never written to run on Windows. The real-browser tests are opt-in through
  # CITADEL_COBROWSE_BROWSER_IT and run once against Chrome and once against
  # Edge (both preinstalled on the image), plus once through plain discovery.
  windows-cobrowse:
    name: Windows co-browse (unit + real browser)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet (local-mode packages)
        run: go vet ./internal/platform/ ./internal/localcobrowse/ ./internal/localviewer/ ./internal/localaudit/ ./internal/cobrowsestream/ ./internal/cobrowseprofile/ ./internal/nodevault/

      - name: Local co-browse service, owner lock, viewer and audit log
        run: go test ./internal/localcobrowse/... ./internal/localviewer/ ./internal/localaudit/ -count=1

      # Saved logins (aceteam#13503 S7): the profile store, its cross-process
      # LockFileEx lock and the #820 at-rest refusal.
      - name: Saved-logins profile store and at-rest passphrase
        run: |
          go test ./internal/cobrowseprofile/ -count=1
          go test ./internal/nodevault/ -count=1 -run '^(TestAtRest|TestSetPassphrase|TestUnlockAtRest|TestChangePassphrase|TestWeakSecret|TestRemoveKeeps|TestNonFinitePolicy|TestSavePolicyRejects)'

      - name: Mountable stream handler
        run: go test ./internal/cobrowsestream/ -count=1 -run '^(TestMounted|TestStreamFollowsPopup|TestStreamSurvives|TestStreamDoesNotAttach|TestInputAfterRefusal|TestViewerTargetSwitch|TestParseTarget|TestNodeWideManagerSession)'

      - name: citadel local mcp (stdio JSON-RPC)
        run: go test ./cmd/ -count=1 -run '^(TestHarnessPaths|TestRenderBlocks|TestMerge|TestRunLocalConfig|TestDetectHarness|TestLocalDoctor|TestLocalAudit|TestLocalMCP|TestLocalMode|TestLocalStartOpens|TestLocalViewer|TestCollisionList|TestNewLocalMCPTools|TestLocalToolNamesDoNotCollide|TestNoLocalMCPToolCanApprove|TestLocalCommitPrompts|TestLocalPassphrase|TestLocalProfileStore|TestSecretReader|TestPassphraseWithSpaces|TestLocalStoreDirsArePrivate|TestSignalDuringClose|TestForget)'

      - name: Self-update recovery and swap (Windows-only paths)
        run: go test ./internal/update/ -count=1 -v -run '^(TestRecoverInterruptedSwap|TestAtomicReplaceWindows|TestRecoveryOwnerAuthority)'

      # #1867 setup-page enrollment and the per-user worker (#1873, #1876):
      # the node-dir trust check, the HKCU Run value, the supervisor and the
      # worker lock's Windows byte-range record. A pattern with no matching
      # test yet passes, so this step is live as each slice lands.
      - name: Setup-page enrollment and per-user worker (Windows-only paths)
        run: |
          go test ./cmd/ -count=1 -run '^(TestSetupEnroll|TestCheckSetupNodeDir|TestSetupRoutesAreGuarded|TestSetupVerificationURL|TestSetupPageChecks|TestBackgroundArgv|TestSupervisedByUserSupervisor|TestStopUserWorker|TestWatchStopFile|TestOpenBackgroundLog|TestLocalDoctorReportsUserWorker|TestAgentUpdateIsService)'
          go test ./internal/network/ -count=1 -run '^TestCheckMachineConfigDir'
          go test ./internal/service/ -count=1 -run '^(TestSupervisor|TestBuildRunValue|TestParseRunValue|TestRunValueRegistryRoundTrip|TestAutostartStatus)'
          go test ./internal/worklock/ -count=1 -run '^TestAcquireFile'

      - name: Unit tests (Windows-portable subset)
        run: >-
          go test ./internal/platform/ -count=1 -run
          '^(TestWindows|TestValidateStagedName|TestStageFile|TestResolveStagedFile|TestStagingDir|TestSetFileInput|TestChooser|TestFileUploadPageFence|TestStatusReportsFileUploadPageFence|TestRedactPath|TestReconcileTargets|TestTargetSet|TestUnconfiguredTargetSet|TestRefusedLastPage|TestNavigateFromRefusedPage|TestVerdictCaches|TestCachedRefusalExpires|TestActionsRefusedOnRefusedPage|TestSetActive|TestManagerPageChoice|TestCloseTargetByID|TestActionRefusedWhenAnother|TestActionsAreSentToThe|TestNodeWideManagerDoesNotTrack|TestDefaultLaunch|TestEnsurePrivateDir|TestHeadedUserAgent|TestParseDevToolsActivePort|TestVerifyCDPBrowserID|TestDeheadless|TestBuildChromeArgs|TestDiscoverWindowsBrowser|TestBrowserKindForPath|TestSessionPidfile|TestSessionManager_|TestPersistentProfile_|TestThrowawaySession_NoGracefulClose|TestGracefulClose|TestCleanOrphanedProfileSessions|TestPersistentSessionWritesProfileMarker|TestStartSessionWithID|TestCobrowseSessionActions_|TestCobrowseSessionStart_|TestCobrowseSession_(Isolation|StopRemovesProfileAndSlot|StopAll|Cap|CrashReportsExited|StatusUnknown|Attach|StopDuringLaunch|PidfileRoundTrip))'

      # Both installer entrypoints from this elevated runner (citadel-cli#1695).
      # Downloads the latest release, since the installers have no local-archive
      # option.
      - name: Installer ownership (both entrypoints, per-user and machine-wide)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/test-install-owner.ps1

      # The shipped binary, end to end: discovery, a hidden test launch, the
      # loopback bind and the audit/owner checks, plus the stdio server's
      # initialize/tools/list. The runner's own profile is throwaway.
      - name: citadel local doctor and local mcp (built binary)
        shell: pwsh
        run: |
          go build -o citadel.exe ./cmd/citadel
          # A go build output is not an installer, so the elevated runner leaves it
          # owned by Administrators, which doctor flags (#1695); apply the
          # documented fix first.
          icacls ./citadel.exe /setowner "$env:USERDOMAIN\$env:USERNAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./citadel.exe local doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $in = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"clientInfo":{"name":"ci"}}}' + "`n" + '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          $out = $in | ./citadel.exe local mcp
          $out
          if (-not ($out -match 'local_cobrowse_start')) { Write-Error "tools/list did not list local_cobrowse_start"; exit 1 }

      - name: Real browser via discovery
        env:
          CITADEL_COBROWSE_BROWSER_IT: "1"
        run: go test ./internal/platform/ -count=1 -v -run '^TestWindowsRealBrowserSession$'

      - name: Real browser (Chrome)
        env:
          CITADEL_COBROWSE_BROWSER_IT: "1"
          CITADEL_COBROWSE_BROWSER: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          CITADEL_COBROWSE_EXPECT_KIND: chrome
        shell: pwsh
        run: ./scripts/ci-real-browser.ps1 -Pattern '^(TestLocalModeGateThroughMCP|TestWindowsRealBrowser|TestWindowsRealBrowserFileUpload|TestWindowsRealBrowserFileUploadSpoof|TestRealBrowserEgressGuard|TestRealBrowserFirstLoadThroughGuard|TestRealBrowserCommitActions|TestRealBrowserPopupSignIn|TestRealBrowserPersistentProfileRoundTrip|TestViewerPageInRealBrowser|TestViewerEnterInRealBrowser|TestViewerFirstInputAfterHandoffInRealBrowser|TestViewerFocusAfterHandoffInRealBrowser|TestLaunchFileOpensViewerInRealBrowser)'

      - name: Real browser (Edge)
        env:
          CITADEL_COBROWSE_BROWSER_IT: "1"
          CITADEL_COBROWSE_BROWSER: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          CITADEL_COBROWSE_EXPECT_KIND: edge
        shell: pwsh
        run: ./scripts/ci-real-browser.ps1 -Pattern '^(TestLocalModeGateThroughMCP|TestWindowsRealBrowser|TestWindowsRealBrowserFileUpload|TestWindowsRealBrowserFileUploadSpoof|TestRealBrowserEgressGuard|TestRealBrowserFirstLoadThroughGuard|TestRealBrowserCommitActions|TestRealBrowserPopupSignIn|TestRealBrowserPersistentProfileRoundTrip|TestViewerPageInRealBrowser|TestViewerEnterInRealBrowser|TestViewerFirstInputAfterHandoffInRealBrowser|TestViewerFocusAfterHandoffInRealBrowser|TestLaunchFileOpensViewerInRealBrowser)'

  # Linux co-browse real-browser gate (citadel-cli#1546). Issue #1546 took four
  # fix rounds because unit tests used fakes that real Chrome did not match
  # (Chrome moves itself into an app scope; a fixed debug port writes no
  # DevToolsActivePort). This runs the real xvfbRunner, Xvfb plus the Chrome
  # preinstalled on the GitHub-hosted image, behind CITADEL_REAL_BROWSER_TESTS.
  # No self-hosted runners, secrets or artifacts. The systemd-scope path needs a
  # user systemd manager the hosted runner lacks; that test skips with a reason
  # and cobrowse_scope_test.go keeps the logic covered.
  linux-cobrowse-real-browser:
    name: Linux co-browse (real browser)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Chrome version
        run: google-chrome --version

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chrome's
      # sandbox needs. Best effort: the knob is absent on older images.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Real browser co-browse lifecycle
        env:
          CITADEL_REAL_BROWSER_TESTS: "1"
        run: go test ./internal/platform/ -count=1 -v -run '^(TestCobrowseRealBrowser|TestCobrowseRealBrowserFileUpload|TestCobrowseRealBrowserFileUploadSpoof)'

      # Saved logins survive stop, seal, unlock and a second session with the
      # real browser (aceteam#13503 S7). Synthetic loopback page only.
      - name: Saved-logins round trip (real browser)
        env:
          CITADEL_COBROWSE_BROWSER_IT: "1"
        run: go test ./internal/localcobrowse/ -count=1 -v -run '^TestRealBrowserPersistentProfileRoundTrip$'

      # First page load through the egress guard stays under the 10s budget
      # (citadel-cli#1694: a keyring wait made it ~25s).
      - name: Real browser first page load through the egress guard
        env:
          CITADEL_COBROWSE_BROWSER_IT: "1"
        run: go test ./internal/localcobrowse/ -count=1 -v -run '^TestRealBrowserFirstLoadThroughGuard$'

      # Local-mode commit detection (citadel-cli#1636): the in-page target
      # probe and classifier against real Chrome on a synthetic page.
      - name: Real browser local-mode commit actions
        env:
          CITADEL_REAL_BROWSER_TESTS: "1"
        run: go test ./internal/localcobrowse/ -count=1 -v -run '^TestRealBrowserCommitActions'

      # Enter from the viewer submits a form (citadel-cli#1778).
      - name: Real browser viewer Enter key
        env:
          CITADEL_REAL_BROWSER_TESTS: "1"
        run: go test ./internal/cobrowsestream/ -count=1 -v -run '^TestViewerEnterInRealBrowser$'

      # The local-mode gate end to end (citadel-cli#1683): the built binary's
      # `citadel local mcp` over stdio with a scripted client, a scripted human
      # on the viewer's routes, and a local login page. Temp HOME, no network.
      - name: Real browser local-mode gate through citadel local mcp
        env:
          CITADEL_REAL_BROWSER_TESTS: "1"
        run: go test ./tests/localgate/ -count=1 -v -run '^TestLocalModeGateThroughMCP$'

  # Cross-compile smoke for every release target. Catches a target that builds
  # locally but breaks on a GOOS/GOARCH the host can't run, so a release tag can
  # never fail at build.sh time after the tag is cut. -o /dev/null: we only need
  # the compile to succeed, not the artifact.
  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0 mirrors build.sh exactly (it cross-builds every target
      # with cgo off), so no C cross-toolchain / build-essential is needed on
      # the pod and the smoke matches what release actually does.
      - name: go build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/citadel

      # EVERY package, not just the shipped binary. ./cmd/citadel alone left a
      # blind spot: internal/nvr used Unix-only syscalls and broke `go build ./...`
      # for GOOS=windows for weeks (#663) while this matrix stayed green, because
      # only ./cmd/nvrconfig imports it. Releases were unaffected, which is
      # exactly what made it invisible -- the failure landed on whoever next
      # checked their own Windows build and found a break that was not theirs.
      # No -o: a multi-package build discards its output.
      - name: go build ./... ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  # Tokenizer smoke test for the diffusers sidecar (citadel-cli#829). Real
  # incident: LTX-Video's T5 tokenizer failed to construct on a live node,
  # mid-provision -- first a missing tiktoken, then a missing
  # sentencepiece/protobuf -- because nothing had ever exercised tokenizer
  # construction before the sidecar image shipped. build-diffusers-service.yml
  # deliberately does NOT build the (multi-GB, CUDA) sidecar image on PRs (see
  # that workflow's comment), so this is NOT a full-image build: it installs
  # only the pinned tokenizer-stack packages from
  # services/diffusers-service/requirements.txt (no torch/diffusers/
  # accelerate) and runs a CPU-only script that imports each pinned dep
  # directly and constructs a tokenizer for each model family the sidecar
  # serves, downloading only small tokenizer/config files -- never the
  # multi-GB weight shards a real model load would pull. See
  # services/diffusers-service/scripts/check_tokenizer_deps.py for exactly
  # what is and isn't covered (including why one probe is gated on an
  # optional HF_TOKEN secret that this repo does not currently define, and why
  # the tier-2 probes only ever SKIP -- never fail -- on a network/HF problem).
  #
  # Path-filtered so it only does real work when the sidecar source or this
  # workflow file changes -- same "don't tax unrelated PRs" reasoning
  # build-diffusers-service.yml documents, but a different mechanism: that
  # workflow uses a workflow-level `on.push.paths` filter and doesn't trigger
  # on pull_request at all, whereas ci.yml runs on every PR/push and this job
  # instead uses a step-level `dorny/paths-filter` (below) to skip its own
  # steps when nothing under services/diffusers-service/** changed.
  diffusers-tokenizer-smoke:
    name: Diffusers sidecar tokenizer smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check for sidecar changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sidecar:
              - 'services/diffusers-service/**'
              - '.github/workflows/ci.yml'

      - name: Set up Python
        if: steps.changes.outputs.sidecar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned tokenizer-stack deps
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/diffusers-service
        run: |
          python -m pip install --upgrade pip
          # Install only the tokenizer-relevant subset of requirements.txt --
          # sourced from the pinned file itself (not restated here) so this
          # step can never drift from the versions the sidecar image actually
          # ships. Deliberately skips torch/diffusers/accelerate: this is a
          # CPU-only tokenizer test, not a model-load test.
          deps="$(grep -E '^(transformers|sentencepiece|protobuf|tiktoken|ftfy)==' requirements.txt)"
          echo "$deps"
          pip install $deps

      - name: Tokenizer construction smoke test
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/diffusers-service
        # HF_TOKEN is optional and not currently defined as a repo secret;
        # when absent the script skips (not fails) the one probe that needs
        # it (SD 3.5 Medium is HF-gated). Tier 2 as a whole only ever SKIPS on
        # a network/HF problem -- see the script's module docstring for why
        # that's deliberate and what stays a hard, offline gate (tier 1, plus
        # the tier-2 dependency-shaped-failure path exercised by
        # Lightricks/LTX-Video, the model this issue is actually about).
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/check_tokenizer_deps.py

      # citadel #902: model_preflight.py's free-space preflight + prefetch
      # guard is deliberately import-light (huggingface_hub only, no
      # diffusers/torch/fastapi -- see the module docstring), so its tests
      # run hermetically in a plain pytest install, no other sidecar deps
      # needed. Same path-filter as the tokenizer-stack step above.
      - name: Install pytest
        if: steps.changes.outputs.sidecar == 'true'
        run: python -m pip install --quiet pytest

      - name: Model preflight unit tests
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/diffusers-service
        run: python -m pytest test_model_preflight.py -v

      # citadel #958: test_app.py exercises app.py's HTTP contract for both
      # /generate (image, pre-existing) and /generate/video (text-to-video)
      # with the pipeline load functions monkeypatched -- see that file's
      # module docstring. Needs fastapi/pydantic (+ httpx, for Starlette's
      # TestClient) but deliberately NOT torch/diffusers/accelerate/imageio:
      # app.py only imports those lazily, inside the very functions this
      # suite mocks out. Sourced from requirements.txt (not restated here)
      # for the same drift-proofing reason as the tokenizer-stack step above.
      - name: Install app test deps (fastapi/pydantic, no torch/diffusers)
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/diffusers-service
        run: |
          deps="$(grep -E '^(fastapi|pydantic)==' requirements.txt)"
          echo "$deps"
          pip install $deps httpx

      # citadel-cli#1335: test_image_models.py (allowlist + VRAM-budget variant
      # selection) and test_image_swap.py (swap/warming logic over a fake
      # loader) are stdlib-only; test_app.py also covers per-request model
      # selection over the same fakes.
      - name: App contract tests (image + video paths, pipeline mocked)
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/diffusers-service
        run: python -m pytest test_app.py test_image_models.py test_image_swap.py -v

  whisper-sidecar-contract:
    name: Whisper sidecar contract and dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check for whisper sidecar changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sidecar:
              - 'services/whisper-service/**'
              - 'services/compose/transcribe.yml'
              - 'internal/jobs/transcribe_audio.go'
              - '.github/workflows/ci.yml'

      - name: Set up Python
        if: steps.changes.outputs.sidecar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight contract-test dependencies
        if: steps.changes.outputs.sidecar == 'true'
        run: >-
          python -m pip install
          pytest==8.3.5
          fastapi==0.142.2
          starlette==1.3.1
          pydantic==2.13.5

      - name: Hermetic transcription and diarization contract tests
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/whisper-service
        run: python -m pytest test_app.py -v

      - name: Audit hash-locked runtime dependencies
        if: steps.changes.outputs.sidecar == 'true'
        working-directory: services/whisper-service
        run: |
          python -m pip install pip-audit==2.9.0
          # #1510: exact CPU Torch requires setuptools<82. Temporary, advisory-only
          # exception; remove with a compatible patched pin/vendor backport.
          # Scope and remaining risk: services/whisper-service/SECURITY-LOCK-1510.md.
          pip-audit -r requirements.txt --no-deps --disable-pip \
            --ignore-vuln GHSA-rrmf-rvhw-rf47 \
            --ignore-vuln GHSA-h35f-9h28-mq5c \
            --ignore-vuln GHSA-xmj3-9gf7-h52w
          grep -F 'torch-2.11.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=f82e2ae20c1545bb03997d1cc3143d94e14b800038669ee1aca45808a9acc338' requirements.in requirements.txt
          grep -F 'torchaudio-2.11.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=2354248848d06a9ae1e7a12165f800f0dda7df60ecac9fca892322b722b922c0' requirements.in requirements.txt
          if grep -F 'torch==2.8.0' requirements.in requirements.txt; then
            echo 'Torch 2.8.0 is prohibited by GHSA-vgrw-7cvw-pwgx'
            exit 1
          fi
