name: Build hermes-service image

# Builds and publishes the headless Hermes Agent runtime sidecar to GHCR as
# ghcr.io/aceteam-ai/hermes-service. The node compose files
# (services/compose/hermes.yml and services/hermes-service/compose.yml) pull
# this image when a node provisions the "hermes" runtime (the second
# agent-runtime harness after claudecode, aceteam#8170), so the image MUST
# exist in the registry before the module can actually run. Mirrors
# build-claudecode-service.yml exactly -- that workflow was added by
# citadel-cli#459 as a same-repo follow-up AFTER claudecode's own Dockerfile
# PR (#432) merged non-draft, establishing that an unpublished image is not a
# merge blocker in this repo. This PR bundles both pieces (Dockerfile here,
# workflow) together instead of splitting them across two PRs.
#
# Triggers only when the service source changes on main (or manually), so
# ordinary Go PRs don't rebuild the image. We intentionally do NOT build on
# pull_request: gating an unmerged PR on an image build adds no signal -- the
# first real build runs post-merge on main where it can be watched. Use
# workflow_dispatch to build a branch on demand.
# Tags: `latest` on main plus the commit SHA for pinning/rollback.
on:
  push:
    branches: [main]
    paths:
      - "services/hermes-service/**"
      - ".github/workflows/build-hermes-service.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/aceteam-ai/hermes-service

jobs:
  build:
    name: Build + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/hermes-service
          file: services/hermes-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
