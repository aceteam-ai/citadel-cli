name: Build browser-runtime image

# Builds and publishes the Citadel browser runtime (the meeting media stack image,
# renamed in aceteam-ai/citadel-cli#1759) to GHCR as
# ghcr.io/aceteam-ai/browser-runtime, and ALSO under the legacy name
# ghcr.io/aceteam-ai/meeting-service (same digest) so existing compose and catalog
# references keep working for one release. Releases pin
# ghcr.io/aceteam-ai/browser-runtime:<sha>@sha256:<digest> (follow-up PR per build). The module compose
# (services/meeting-service/compose.yml, and the catalog copy in
# aceteam-ai/citadel-services) pulls this image when a node runs
# `citadel module install meeting` (aceteam-ai/citadel-cli#514), so the image MUST
# exist in the registry -- the exact failure mode that bit whisper-service (image
# never published) is what this workflow prevents.
#
# Triggers only when the service source changes on main (or manually), so ordinary
# Go PRs don't rebuild the image. We intentionally do NOT build on pull_request:
# gating an unmerged PR on an image build adds no signal -- the first real build
# runs post-merge on main where it can be watched. Use workflow_dispatch to build a
# branch on demand.
# Tags: `latest` on main plus the commit SHA for pinning/rollback.
on:
  push:
    branches: [main]
    paths:
      - "services/meeting-service/**"
      - ".github/workflows/build-meeting-service.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/aceteam-ai/browser-runtime
  LEGACY_IMAGE: ghcr.io/aceteam-ai/meeting-service

jobs:
  build:
    name: Build + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pass 1: build locally (not pushed) only to read the Chromium major the
      # image resolved to; pass 2 bakes it into the image label.
      - name: Probe build
        uses: docker/build-push-action@v6
        with:
          context: services/meeting-service
          file: services/meeting-service/Dockerfile
          platforms: linux/amd64
          load: true
          tags: browser-runtime:probe
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read Chromium major
        id: major
        run: |
          major="$(docker run --rm --entrypoint cat browser-runtime:probe /etc/browser-runtime/chromium-major)"
          case "$major" in ''|*[!0-9]*) echo "bad chromium major: $major" >&2; exit 1;; esac
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/meeting-service
          file: services/meeting-service/Dockerfile
          # v1 is amd64-only; the service.yaml declares arch: [amd64] to match.
          # arm64 (multi-arch chromium + audio validation on arm) is a follow-up.
          platforms: linux/amd64
          push: true
          build-args: |
            CHROMIUM_MAJOR=${{ steps.major.outputs.major }}
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.LEGACY_IMAGE) || '' }}
            ${{ env.LEGACY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
