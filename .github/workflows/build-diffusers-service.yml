name: Build diffusers-service image

# Builds and publishes the node-local diffusers text-to-image sidecar to GHCR
# as ghcr.io/aceteam-ai/diffusers-service. The node compose file
# (services/compose/diffusers.yml) pulls this image when a node runs
# SERVICE_START "diffusers" (aceteam #4468), so the image must exist in the
# registry for the deploy path to work end-to-end.
#
# Triggers only when the service source changes on main (or manually), so
# ordinary Go PRs don't rebuild a multi-GB CUDA image. We intentionally do NOT
# build on pull_request: the build is heavy and expensive, and gating a PR on a
# multi-GB CUDA image build (that isn't merging yet) adds no signal -- the first
# real build runs post-merge on main where it can be watched. Use
# workflow_dispatch to build a branch on demand.
# Tags: the commit SHA always; `latest` ONLY on refs/heads/main. Nodes do NOT
# run :latest: services/compose/diffusers.yml pins <commit-sha>@<digest>
# (citadel-cli#1346), so a build here reaches the fleet only after a follow-up
# PR bumps that pin and a citadel release ships it.
on:
  push:
    branches: [main]
    paths:
      - "services/diffusers-service/**"
      - ".github/workflows/build-diffusers-service.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/aceteam-ai/diffusers-service

jobs:
  build:
    name: Build + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once into the local daemon and smoke-test BEFORE anything is pushed.
      # What this can and cannot catch: triton only compiles its CUDA driver stub
      # when a GPU driver initializes, so a GPU-less runner cannot reproduce the
      # exact "Failed to find C compiler" failure seen in GPU acceptance on node
      # 1795. It CAN catch the cause: a missing compiler or libc/Python headers
      # (compiling a C file against Python.h with CC unset), and a broken import
      # of bitsandbytes / diffusers / the pipeline classes. The sidecar's /health
      # `self_test` repeats the import check at boot on the real node.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: services/diffusers-service
          file: services/diffusers-service/Dockerfile
          push: false
          load: true
          tags: diffusers-service:ci
          cache-from: type=gha

      - name: Smoke test (imports, C compiler, CC unset)
        run: |
          docker run --rm --entrypoint sh diffusers-service:ci -c '
            set -e
            unset CC
            command -v cc || command -v gcc
            printf "#include <Python.h>\nint main(void){return 0;}\n" > /tmp/t.c
            cc /tmp/t.c -I"$(python -c "import sysconfig;print(sysconfig.get_paths()[\"include\"])")" -o /tmp/t
            python -c "import bitsandbytes, diffusers; from diffusers import AutoPipelineForText2Image, Flux2KleinPipeline, ZImagePipeline, QwenImagePipeline, WanPipeline, AutoencoderKLWan, PipelineQuantizationConfig; print(\"imports ok\")"
          '

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/diffusers-service
          file: services/diffusers-service/Dockerfile
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
