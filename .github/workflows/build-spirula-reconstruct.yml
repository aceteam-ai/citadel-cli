name: Build spirula-reconstruct image

# The image is amd64-only because upstream v2026.9.30 publishes its Linux
# Vulkan release for x86_64. GPU execution remains a documented 3090-node gate;
# CI builds and publishes the reproducible image without requiring a GPU.
on:
  push:
    branches: [main]
    paths:
      - "cmd/spirula-reconstruct/**"
      - "internal/reconstruct/**"
      - "services/spirula-reconstruct/**"
      - ".github/workflows/build-spirula-reconstruct.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/aceteam-ai/spirula-reconstruct

jobs:
  build:
    name: Build + push pinned image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/spirula-reconstruct/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:spirula-2026.9.30
          cache-from: type=gha
          cache-to: type=gha,mode=max
